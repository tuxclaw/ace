[package]
name = "ace"
version = "0.1.0"
description = "AI screenshot answer tool"
authors = ["Andy <andy@tuxclaw.dev>"]
edition = "2021"

[lib]
name = "ace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.2", features = [] }

[dependencies]
arboard = "3.6.1"
base64 = "0.22.1"
reqwest = { version = "0.12.24", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tauri = { version = "2.9.4", features = ["tray-icon"] }
xcap = "=0.8.2"
